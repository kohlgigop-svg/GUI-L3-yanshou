<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <title>情况分析报告工具</title>

  <style>
    :root {
      --primary: #4f6ef7;
      --primary-light: #eef0ff;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --purple: #a855f7;
      --bg: #f5f7ff;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;

      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);

      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary);

      margin-bottom: 32px;
    }

      background: var(--primary-light);

      text-align: center;

      position: relative;

    #drop-zone.drag-over {

      border-color: #2d44c8;

    #drop-zone strong { color: var(--primary); }

      border-radius: 12px;

      text-align: left;

      justify-content: space-between;

      margin-bottom: 10px;

    .file-queue-summary {

    .mini-btn {

      padding: 4px 6px;

    .mini-btn:hover { background: #eef2ff; color: var(--primary); }
    .file-list {
      display: grid;
      gap: 8px;

      overflow-y: auto;
    }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;

    .file-item-main {
      min-width: 0;
      flex: 1;

    .file-item-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);

    }
    .file-item-meta {
      font-size: 0.8rem;

      margin-top: 3px;

    .file-item-remove {
      border: none;
      background: #fee2e2;
      color: #b91c1c;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      flex-shrink: 0;

    .file-item-remove:hover { background: #fecaca; }
    .upload-action-bar {
      max-width: 760px;
      margin: 0 auto 32px;

      justify-content: center;
      gap: 12px;

    .action-bar {

      flex-wrap: wrap;

    .btn {

    .task-tables-container {
      display: grid;

      margin-top: 18px;

    .task-table-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);

      justify-content: space-between;

    }
    .task-table-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .task-table-title {

      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }
    .task-table-desc {
      font-size: 0.84rem;
      color: var(--muted);
      margin-top: 6px;
    }
    .task-table-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.88rem;
      font-weight: 700;
    }
    .task-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .task-detail-table th:nth-child(2),
    .task-detail-table td:nth-child(2) {

    }
    .task-empty {
      padding: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px dashed var(--border);
    }

    .tag {

      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .tag-success  { background: #dcfce7; color: #15803d; }
    .tag-model    { background: #fef3c7; color: #92400e; }
    .tag-env      { background: #fee2e2; color: #b91c1c; }
    .tag-screen   { background: #ede9fe; color: #6d28d9; }

    /* 进度条 */
    .bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bar-bg {
      flex: 1;
      height: 8px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.6s ease;
    }
    .bar-pct {
      font-weight: 700;
      font-size: 0.88rem;
      min-width: 48px;
      text-align: right;
      color: var(--text);
    }

    /* 复制成功提示 */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #1e293b;
      color: #fff;
      padding: 12px 28px;
      border-radius: 99px;
      font-size: 0.92rem;
      font-weight: 600;
      transition: transform 0.3s, opacity 0.3s;
      opacity: 0;
      z-index: 999;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>

<script>
// ---- 需要统计的目标列名（忽略大小写和空格进行匹配） ----
const TARGET_COLUMNS = [
  { key: 'task 完成情况:任务成功', tagClass: 'tag-success', barColor: '#22c55e' },
  { key: 'task 完成情况:模型问题', tagClass: 'tag-model',   barColor: '#f59e0b' },
  { key: 'task 完成情况:工程环境问题', tagClass: 'tag-env',     barColor: '#ef4444' },
  { key: 'task 完成情况:执行中连续黑屏超10屏', tagClass: 'tag-screen',  barColor: '#a855f7' },
  { key: 'task 完成情况:task问题', tagClass: 'tag-task',    barColor: '#3b82f6' }
];

// 标准化字符串，用于列名匹配
function normalize(s) {
  return String(s || '').replace(/[\s\u3000:：\-]/g, '').toLowerCase();
}

function isSkippedTaskValue(v) {
  return String(v ?? '').trim() === '是';
}

function filterSkippedTaskRows(dataRows, taskIdColIdx, skipColIdx) {
  if (taskIdColIdx === -1 || skipColIdx === -1) return dataRows;

  const skippedTaskIds = new Set();
  let currentTaskId = '';

  dataRows.forEach(row => {
    const rawTaskId = String(row[taskIdColIdx] ?? '').trim();
    if (rawTaskId !== '') currentTaskId = rawTaskId;
    if (currentTaskId && isSkippedTaskValue(row[skipColIdx])) {
      skippedTaskIds.add(currentTaskId);
    }
  });

  if (skippedTaskIds.size === 0) return dataRows;

  const filteredRows = [];
  currentTaskId = '';
  dataRows.forEach(row => {
    const rawTaskId = String(row[taskIdColIdx] ?? '').trim();
    if (rawTaskId !== '') currentTaskId = rawTaskId;
    if (currentTaskId && skippedTaskIds.has(currentTaskId)) return;
    filteredRows.push(row);
  });

  return filteredRows;
}

function getCellText(row, colIdx) {
  if (colIdx === -1 || colIdx === undefined || colIdx === null) return '';
  return String(row[colIdx] ?? '').trim();
}

function isSuccessfulTaskValue(v) {
  const text = String(v ?? '').trim();
  return text === '完全成功' || text === '任务成功';
}

function getTaskCompletionLabel(targetKey, cellVal) {
  if (targetKey === 'task 完成情况:任务成功') return '完全成功';
  return String(cellVal ?? '').trim() || String(targetKey).split(':').pop();
}

function cleanTaskName(name) {
  const text = String(name ?? '').trim();
  if (!text) return '';

  const matched = text.match(/^(.*)_[A-Za-z0-9]{8}(?:-[A-Za-z0-9]{4}){3}-[A-Za-z0-9]{12}_[0-9]{8}_flowv[A-Za-z0-9_-]+$/);
  return matched && matched[1] ? matched[1].trim() : text;
}

function sanitizeFileName(name) {

  return String(name || '未命名')
    .replace(/[\\/:*?"<>|]/g, '_')
    .trim() || '未命名';
}

function downloadTaskTableFile(rows, fileName, sheetName) {
  const aoa = [
    ['task完成情况', '项目id', '任务id', '任务名称'],
    ...rows.map(item => [item.completion, item.projectId, item.taskId, item.taskName])
  ];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, fileName);
}

function appendTasksToMap(dataRows, projectIdVal, taskIdColIdx, taskNameColIdx, colMapping, taskMap) {
  if (taskIdColIdx === -1) return taskMap;

  let currentTaskId = '';
  let currentTaskName = '';

  dataRows.forEach(row => {
    const rawTaskId = getCellText(row, taskIdColIdx);
    const rawTaskName = cleanTaskName(getCellText(row, taskNameColIdx));

    if (rawTaskId) currentTaskId = rawTaskId;
    if (rawTaskName) currentTaskName = rawTaskName;
    if (!currentTaskId) return;

    const taskMapKey = `${projectIdVal}__${currentTaskId}`;
    if (!taskMap.has(taskMapKey)) {
      taskMap.set(taskMapKey, {
        projectId: projectIdVal || '未知项目ID',
        taskId: currentTaskId,
        taskName: currentTaskName || '未填写',
        statuses: []
      });
    }

    const task = taskMap.get(taskMapKey);
    if (currentTaskName) task.taskName = currentTaskName;

    TARGET_COLUMNS.forEach(target => {
      const colIndex = colMapping[target.key];
      if (colIndex === undefined) return;

      const cellVal = getCellText(row, colIndex);
      if (!cellVal) return;

      if (!task.statuses.some(item => item.key === target.key && item.value === cellVal)) {
        task.statuses.push({ key: target.key, value: cellVal });
      }
    });
  });

  return taskMap;
}

function finalizeTaskTables(taskMap) {
  const successTasks = [];
  const failedTasks = [];
  const countMap = Object.fromEntries(TARGET_COLUMNS.map(target => [target.key, 0]));
  const anomalyKeys = new Set([
    'task 完成情况:工程环境问题',
    'task 完成情况:执行中连续黑屏超10屏',
    'task 完成情况:task问题'
  ]);
  let anomalyTaskCount = 0;

  taskMap.forEach(task => {
    const statusLabels = task.statuses.map(item => getTaskCompletionLabel(item.key, item.value));
    const hasSuccess = task.statuses.some(item => item.key === 'task 完成情况:任务成功' && isSuccessfulTaskValue(item.value));
    const taskStatusKeys = new Set(task.statuses.map(item => item.key));
    const hasFailure = [...taskStatusKeys].some(key => key !== 'task 完成情况:任务成功');

    if (hasSuccess && !hasFailure) {
      countMap['task 完成情况:任务成功'] += 1;
    }

    TARGET_COLUMNS.forEach(target => {
      if (target.key === 'task 完成情况:任务成功') return;
      if (taskStatusKeys.has(target.key)) {
        countMap[target.key] += 1;
      }
    });

    if ([...anomalyKeys].some(key => taskStatusKeys.has(key))) {
      anomalyTaskCount += 1;
    }

    const rowData = {
      completion: hasSuccess && !hasFailure ? '完全成功' : (statusLabels.length > 0 ? statusLabels.join('、') : '未填写'),
      projectId: task.projectId || '未知项目ID',
      taskId: task.taskId,
      taskName: task.taskName || '未填写'
    };

    if (hasSuccess && !hasFailure) {
      successTasks.push(rowData);
    } else {
      failedTasks.push(rowData);
    }
  });

  const sorter = (a, b) => String(a.taskId).localeCompare(String(b.taskId), 'zh-CN', { numeric: true });
  successTasks.sort(sorter);
  failedTasks.sort(sorter);

  return {
    successTasks,
    failedTasks,
    countMap,
    totalTaskCount: taskMap.size,
    anomalyTaskCount
  };
}

function buildColumnMapping(headers) {
  const colMapping = {};
  const missingCols = [];

  TARGET_COLUMNS.forEach(target => {
    const normTarget = normalize(target.key);
    const colIndex = headers.findIndex(h => {
      const normH = normalize(h || '');
      return normH.includes(normTarget) || normTarget.includes(normH);
    });

    if (colIndex !== -1) {
      colMapping[target.key] = colIndex;
    } else {
      missingCols.push(target.key);
    }
  });

  return { colMapping, missingCols };
}

function formatProjectDisplay(projectIds, fileCount) {
  const uniqueProjectIds = [...new Set(projectIds.filter(Boolean))];
  if (uniqueProjectIds.length === 0) return fileCount > 1 ? '未识别项目ID' : '未知项目ID';
  if (uniqueProjectIds.length === 1) return uniqueProjectIds[0];
  if (uniqueProjectIds.length <= 3) return uniqueProjectIds.join('、');
  return `${uniqueProjectIds.slice(0, 3).join('、')} 等 ${uniqueProjectIds.length} 个项目`;
}

function buildDownloadBaseName(projectIds, fileCount) {
  const uniqueProjectIds = [...new Set(projectIds.filter(Boolean))];
  if (fileCount === 1) return uniqueProjectIds[0] || '未知项目ID';
  if (uniqueProjectIds.length === 1) return `${uniqueProjectIds[0]}_${fileCount}文件汇总`;
  return `${fileCount}文件汇总`;
}

function isSpreadsheetFile(file) {
  return /\.(xlsx|xls|csv)$/i.test(file.name || '');
}

function getFileKey(file) {
  return `${file.name}__${file.size}__${file.lastModified}`;
}

function formatFileSize(size) {
  if (size >= 1024 * 1024) return `${(size / 1024 / 1024).toFixed(2)} MB`;
  if (size >= 1024) return `${(size / 1024).toFixed(1)} KB`;
  return `${size} B`;
}

let uploadedFiles = [];

// ---- 拖拽 & 文件列表 ----
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const fileQueuePanel = document.getElementById('file-queue-panel');
const fileQueueSummary = document.getElementById('file-queue-summary');
const fileList = document.getElementById('file-list');
const clearFilesBtn = document.getElementById('clear-files-btn');
const startAnalyzeBtn = document.getElementById('start-analyze-btn');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  addFiles(Array.from(e.dataTransfer.files || []));
});
fileInput.addEventListener('change', e => {
  addFiles(Array.from(e.target.files || []));
  e.target.value = '';
});
fileQueuePanel.addEventListener('click', e => e.stopPropagation());
clearFilesBtn.addEventListener('click', e => {
  e.stopPropagation();
  uploadedFiles = [];
  renderFileQueue();
});
startAnalyzeBtn.addEventListener('click', startAnalysis);
renderFileQueue();

function renderFileQueue() {

  const hasFiles = uploadedFiles.length > 0;
  fileQueuePanel.style.display = hasFiles ? 'block' : 'none';
  startAnalyzeBtn.disabled = !hasFiles;
  clearFilesBtn.disabled = !hasFiles;
  fileList.innerHTML = '';

  if (!hasFiles) return;

  fileQueueSummary.textContent = `已添加 ${uploadedFiles.length} 个文件，点击“开始分析”后统一处理`;

  uploadedFiles.forEach((file, index) => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `
      <div class="file-item-main">
        <div class="file-item-name">${file.name}</div>
        <div class="file-item-meta">${formatFileSize(file.size)}</div>
      </div>
      <button type="button" class="file-item-remove">移除</button>
    `;

    item.querySelector('.file-item-remove').onclick = (e) => {
      e.stopPropagation();
      uploadedFiles.splice(index, 1);
      renderFileQueue();
    };

    fileList.appendChild(item);
  });
}

function addFiles(files) {
  const validFiles = files.filter(isSpreadsheetFile);
  if (files.length > 0 && validFiles.length === 0) {
    alert('请选择 .xlsx、.xls 或 .csv 文件。');
    return;
  }

  const existingKeys = new Set(uploadedFiles.map(getFileKey));
  let addedCount = 0;

  validFiles.forEach(file => {
    const fileKey = getFileKey(file);
    if (existingKeys.has(fileKey)) return;
    uploadedFiles.push(file);
    existingKeys.add(fileKey);
    addedCount++;
  });

  renderFileQueue();

  if (validFiles.length > 0 && addedCount === 0) {
    showToast('ℹ️ 文件已在列表中，无需重复添加');
  }
}

function readWorkbookFromFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        resolve(XLSX.read(e.target.result, { type: 'array' }));
      } catch (err) {
        reject(new Error(`${file.name} 解析失败，请确认是有效的 .xlsx 文件。\n${err.message}`));
      }
    };
    reader.onerror = () => reject(new Error(`${file.name} 读取失败，请重试。`));
    reader.readAsArrayBuffer(file);
  });
}

function createAggregateState() {
  return {
    fileCount: 0,
    projectIds: [],
    uniqueTaskIds: new Set(),
    countMap: Object.fromEntries(TARGET_COLUMNS.map(target => [target.key, 0])),
    foundKeys: new Set(),
    totalNonEmptyCount: 0,
    missingCols: [],
    taskMap: new Map(),
    stepAccuracyCorrectCount: 0,
    stepAccuracyBaseCount: 0
  };
}

function analyzeWorkbookRows(rows, fileName, aggregate) {
  if (rows.length < 2) {
    throw new Error(`${fileName} 数据不足（没有数据行），请检查。`);
  }

  const headers = rows[0];
  const dataRows = rows.slice(1);
  const projectIdColIdx = headers.findIndex(h => normalize(h || '') === normalize('项目ID'));
  const taskIdColIdx = headers.findIndex(h => normalize(h || '') === normalize('任务id') || normalize(h || '') === normalize('任务ID'));
  const taskNameColIdx = headers.findIndex(h => normalize(h || '') === normalize('任务名称'));
  const skipColIdx = headers.findIndex(h => normalize(h || '') === normalize('是否跳过'));
  const stepCorrectColIdx = headers.findIndex(h => normalize(h || '') === normalize('step 正确性判断:正确'));
  const stepIncorrectColIdx = headers.findIndex(h => normalize(h || '') === normalize('step 正确性判断:不正确'));
  const stepReturnColIdx = headers.findIndex(h => normalize(h || '') === normalize('step 正确性判断:错误页面引导点击返回了'));
  const stepAfterWrongColIdx = headers.findIndex(h => normalize(h || '') === normalize('step 正确性判断:此页之后step均错误'));
  const filteredDataRows = filterSkippedTaskRows(dataRows, taskIdColIdx, skipColIdx);

  let projectIdVal = '未知项目ID';
  if (projectIdColIdx !== -1) {
    const foundRow = dataRows.find(r => String(r[projectIdColIdx] || '').trim() !== '');
    if (foundRow) {
      projectIdVal = String(foundRow[projectIdColIdx]).trim();
    }
  }

  aggregate.fileCount += 1;
  aggregate.projectIds.push(projectIdVal);

  dataRows.forEach(row => {
    const correctVal = stepCorrectColIdx !== -1 ? getCellText(row, stepCorrectColIdx) : '';
    const incorrectVal = stepIncorrectColIdx !== -1 ? getCellText(row, stepIncorrectColIdx) : '';
    const returnVal = stepReturnColIdx !== -1 ? getCellText(row, stepReturnColIdx) : '';
    const afterWrongVal = stepAfterWrongColIdx !== -1 ? getCellText(row, stepAfterWrongColIdx) : '';
    const hasAnyStepJudgement = !!(correctVal || incorrectVal || returnVal || afterWrongVal);

    if (hasAnyStepJudgement) {
      aggregate.stepAccuracyBaseCount += 1;
    }
    if (correctVal === '正确') {
      aggregate.stepAccuracyCorrectCount += 1;
    }
  });

  if (taskIdColIdx !== -1) {
    let currentTaskId = '';
    filteredDataRows.forEach(row => {
      const rawTaskId = getCellText(row, taskIdColIdx);
      if (rawTaskId) currentTaskId = rawTaskId;
      if (currentTaskId) aggregate.uniqueTaskIds.add(currentTaskId);
    });
  }

  const { colMapping, missingCols } = buildColumnMapping(headers);
  if (missingCols.length > 0) {
    aggregate.missingCols.push(`${fileName}：${missingCols.join('、')}`);
  }

  TARGET_COLUMNS.forEach(target => {
    const colIndex = colMapping[target.key];
    if (colIndex === undefined) return;

    aggregate.foundKeys.add(target.key);
    filteredDataRows.forEach(row => {
      const val = getCellText(row, colIndex);
      if (!val) return;
      aggregate.countMap[target.key] += 1;
      aggregate.totalNonEmptyCount += 1;
    });
  });

  appendTasksToMap(filteredDataRows, projectIdVal, taskIdColIdx, taskNameColIdx, colMapping, aggregate.taskMap);
}

async function startAnalysis() {
  if (uploadedFiles.length === 0) return;

  const originalHtml = startAnalyzeBtn.innerHTML;
  startAnalyzeBtn.disabled = true;
  startAnalyzeBtn.innerHTML = `
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4"/><path d="m19.07 4.93-2.83 2.83"/><path d="M22 12h-4"/><path d="m19.07 19.07-2.83-2.83"/><path d="M12 22v-4"/><path d="m4.93 19.07 2.83-2.83"/><path d="M2 12h4"/><path d="m4.93 4.93 2.83 2.83"/></svg>
    分析中...
  `;

  try {
    const aggregate = createAggregateState();

    for (const file of uploadedFiles) {
      const workbook = await readWorkbookFromFile(file);
      const firstSheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[firstSheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      analyzeWorkbookRows(rows, file.name, aggregate);
    }

    const { successTasks, failedTasks, countMap, totalTaskCount, anomalyTaskCount } = finalizeTaskTables(aggregate.taskMap);
    const results = TARGET_COLUMNS.map(target => ({
      ...target,
      count: countMap[target.key],
      found: aggregate.foundKeys.has(target.key)
    }));

    renderResult({
      results,
      totalTaskCount,
      anomalyTaskCount,
      stepAccuracyRate: aggregate.stepAccuracyBaseCount > 0 ? (aggregate.stepAccuracyCorrectCount / aggregate.stepAccuracyBaseCount * 100) : 0,
      missingCols: aggregate.missingCols,
      projectIdVal: formatProjectDisplay(aggregate.projectIds, aggregate.fileCount),
      uniqueTaskCount: totalTaskCount,
      successTasks,
      failedTasks,
      fileCount: aggregate.fileCount,
      downloadBaseName: buildDownloadBaseName(aggregate.projectIds, aggregate.fileCount)
    });
  } catch (err) {
    alert(err.message);
  } finally {
    startAnalyzeBtn.innerHTML = originalHtml;
    startAnalyzeBtn.disabled = uploadedFiles.length === 0;
  }
}

function renderTaskTables(successTasks, failedTasks, downloadBaseName) {
  const container = document.getElementById('task-tables-container');
  container.innerHTML = '';
  const safeProjectId = sanitizeFileName(downloadBaseName);

  const tableConfigs = [
    {
      title: '任务成功表格',
      desc: '来自本次分析中“task 完成情况:任务成功”为完全成功的任务，可直接预览与下载',
      countLabel: '成功任务数',
      rows: successTasks,
      emptyText: '当前没有完全成功的任务数据',
      fileName: `${safeProjectId}_任务成功表格.xlsx`,
      sheetName: '任务成功'
    },
    {
      title: '任务失败表格',
      desc: '来自本次分析中除完全成功外的其余任务，可直接预览与下载',
      countLabel: '失败任务数',
      rows: failedTasks,
      emptyText: '当前没有失败任务数据',
      fileName: `${safeProjectId}_任务失败表格.xlsx`,
      sheetName: '任务失败'
    }
  ];

  tableConfigs.forEach(config => {
    const card = document.createElement('div');
    card.className = 'task-table-card';

    const head = document.createElement('div');
    head.className = 'task-table-head';

    const titleWrap = document.createElement('div');
    titleWrap.innerHTML = `
      <div class="task-table-title">${config.title}</div>
      <div class="task-table-desc">${config.desc}</div>
    `;
    head.appendChild(titleWrap);

    const actions = document.createElement('div');
    actions.className = 'task-table-actions';

    const count = document.createElement('div');
    count.className = 'task-table-count';
    count.textContent = `${config.countLabel}：${config.rows.length}`;
    actions.appendChild(count);

    let wrap = null;
    if (config.rows.length > 0) {
      wrap = document.createElement('div');
      wrap.className = 'task-table-wrap';

      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'btn btn-reset';
      toggleBtn.type = 'button';
      toggleBtn.textContent = '收起预览';
      toggleBtn.onclick = () => {
        const isCollapsed = wrap.style.display === 'none';
        wrap.style.display = isCollapsed ? '' : 'none';
        toggleBtn.textContent = isCollapsed ? '收起预览' : '展开预览';
      };
      actions.appendChild(toggleBtn);

      const downloadBtn = document.createElement('button');
      downloadBtn.className = 'btn btn-copy';
      downloadBtn.type = 'button';
      downloadBtn.innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        下载表格文件
      `;
      downloadBtn.onclick = () => downloadTaskTableFile(config.rows, config.fileName, config.sheetName);
      actions.appendChild(downloadBtn);
    }

    head.appendChild(actions);
    card.appendChild(head);

    if (config.rows.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'task-empty';
      empty.textContent = config.emptyText;
      card.appendChild(empty);
      container.appendChild(card);
      return;
    }

    const table = document.createElement('table');
    table.className = 'stats-table task-detail-table';
    table.innerHTML = `
      <thead>
        <tr>
          <th style="min-width:160px;">task完成情况</th>
          <th style="min-width:120px;">项目id</th>
          <th style="min-width:120px;">任务id</th>
          <th>任务名称</th>
        </tr>
      </thead>
      <tbody>
        ${config.rows.map(item => `
          <tr>
            <td>${item.completion}</td>
            <td>${item.projectId}</td>
            <td>${item.taskId}</td>
            <td>${item.taskName}</td>
          </tr>
        `).join('')}
      </tbody>
    `;

    wrap.appendChild(table);
    card.appendChild(wrap);
    container.appendChild(card);
  });
}

function renderResult({ results, totalTaskCount, anomalyTaskCount, stepAccuracyRate, missingCols, projectIdVal, uniqueTaskCount, successTasks, failedTasks, fileCount, downloadBaseName }) {
  const now = new Date().toLocaleString('zh-CN', { hour12: false });
  document.getElementById('report-meta').textContent = fileCount > 1
    ? `数据源：共 ${fileCount} 个文件｜项目ID：${projectIdVal}｜统计时间：${now}`
    : `数据源：${projectIdVal}｜统计时间：${now}`;

  const summaryRow = document.getElementById('summary-row');
  summaryRow.innerHTML = `
    <div class="summary-card" style="max-width: 200px;">
      <div class="s-num">${fileCount}</div>
      <div class="s-label">分析文件数</div>
    </div>
    <div class="summary-card" style="max-width: 260px;">
      <div class="s-num">${uniqueTaskCount}</div>
      <div class="s-label">队列数据量</div>
    </div>
    <div class="summary-card" style="max-width: 260px;">
      <div class="s-num">${stepAccuracyRate.toFixed(2)}%</div>
      <div class="s-label">单步骤正确率</div>
    </div>
  `;

  const tbody = document.getElementById('stats-body');
  tbody.innerHTML = '';

  results.forEach(res => {
    const pct = totalTaskCount > 0 ? (res.count / totalTaskCount * 100) : 0;
    const barColor = res.found ? res.barColor : '#cbd5e1';
    const displayCount = res.found ? res.count : '-';
    const displayPct = res.found ? `${pct.toFixed(2)}%` : '-';

    const row = document.createElement('tr');
    if (!res.found) row.style.opacity = '0.6';

    row.innerHTML = `
      <td><span class="tag ${res.tagClass}">${res.key}</span></td>
      <td style="text-align:center;font-weight:700;font-size:1.1rem">${displayCount}</td>
      <td>
        <div class="bar-wrap">
          <div class="bar-bg">
            <div class="bar-fill" style="width:${res.found ? pct : 0}%;background:${barColor}"></div>
          </div>
        </div>
      </td>
      <td class="bar-pct" style="text-align:right">${displayPct}</td>
    `;
    tbody.appendChild(row);
  });

  const anomalyFound = results.some(res => ['task 完成情况:工程环境问题', 'task 完成情况:执行中连续黑屏超10屏', 'task 完成情况:task问题'].includes(res.key) && res.found);
  const anomalyPct = totalTaskCount > 0 ? (anomalyTaskCount / totalTaskCount * 100) : 0;
  const anomalyRow = document.createElement('tr');
  anomalyRow.style.backgroundColor = '#fff1f2';
  anomalyRow.innerHTML = `
    <td><span class="tag" style="background:#ffe4e6; color:#e11d48; border: 1px solid #fda4af;">异常占比 (汇总)</span></td>
    <td style="text-align:center;font-weight:700;font-size:1.1rem;color:#e11d48;">${anomalyFound ? anomalyTaskCount : '-'}</td>
    <td>
      <div class="bar-wrap">
        <div class="bar-bg" style="background:#fecdd3;">
          <div class="bar-fill" style="width:${anomalyFound ? anomalyPct : 0}%;background:#e11d48"></div>
        </div>
      </div>
    </td>
    <td class="bar-pct" style="text-align:right;color:#e11d48;">${anomalyFound ? (anomalyPct.toFixed(2) + '%') : '-'}</td>
  `;
  tbody.appendChild(anomalyRow);

  const noticeEl = document.getElementById('missing-cols-notice');
  if (missingCols.length > 0) {
    document.getElementById('missing-cols-list').textContent = missingCols.join('； ');
    noticeEl.style.display = 'block';
  } else {
    noticeEl.style.display = 'none';
  }

  renderTaskTables(successTasks, failedTasks, downloadBaseName);

  document.getElementById('result-area').style.display = 'block';
  document.getElementById('result-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---- 截图复制 ----

async function copyScreenshot() {
  const target = document.getElementById('snapshot-target');
  try {
    const canvas = await html2canvas(target, {
      scale: 2,
      backgroundColor: '#ffffff',
      useCORS: true,
      logging: false
    });
    canvas.toBlob(async blob => {
      try {
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]);
        showToast('✅ 截图已复制到剪贴板，可直接粘贴');
      } catch (err) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '情况分析报告.png';
        a.click();
        URL.revokeObjectURL(url);
        showToast('📥 剪贴板写入受限，已自动下载截图');
      }
    }, 'image/png');
  } catch (err) {
    alert('截图失败：' + err.message);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ---- 重置 ----
function resetAll() {
  uploadedFiles = [];
  fileInput.value = '';
  renderFileQueue();
  document.getElementById('stats-body').innerHTML = '';
  document.getElementById('summary-row').innerHTML = '';
  document.getElementById('task-tables-container').innerHTML = '';
  document.getElementById('missing-cols-list').textContent = '';
  document.getElementById('missing-cols-notice').style.display = 'none';
  document.getElementById('report-meta').textContent = '';
  document.getElementById('result-area').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
